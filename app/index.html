<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="DropStudio — plataforma para testear productos: landings, pedidos contra entrega y analítica en un solo lugar.">
<title>DropStudio · Panel de testeo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23131316'/><path d='M20 55h16l10-24 12 48 8-24h16' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<script>
  // Aplica el tema antes del primer pintado para evitar el destello blanco
  (function () {
    try {
      var t = localStorage.getItem('ds_theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui,sans-serif">
      <h1>Necesitas JavaScript</h1>
      <p>DropStudio es un panel interactivo y requiere JavaScript activado.</p>
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
