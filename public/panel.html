<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="VERA &amp; CO — panel de operación de Dermafol y Plasma: pedidos, entregas, páginas y analítica por marca.">
<title>VERA &amp; CO · Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231D4234'/><path d='M30 24H22v52h8M70 24h8v52h-8' stroke='%23D1E870' stroke-width='8' fill='none' stroke-linecap='square'/><rect x='42' y='42' width='16' height='16' fill='%23D1E870'/></svg>">

<script>
  // Aplica el tema antes del primer pintado para evitar el destello blanco
  (function () {
    try {
      // La identidad de VERA & CO es un sistema claro. Quien no ha elegido
      // tema ve el blanco de la marca, no el oscuro que le imponga su sistema
      // operativo; el que prefiera oscuro lo elige y se le recuerda.
      var t = localStorage.getItem('ds_theme') || 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui,sans-serif">
      <h1>Necesitas JavaScript</h1>
      <p>El panel de VERA &amp; CO es interactivo y requiere JavaScript activado.</p>
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
